        <div class="ip-eyebrow">📊 6일 누적 인사이트</div>
        <div class="ip-stats-row">
          <div class="ip-stat"><div class="ip-stat-label">조회수</div><div class="ip-stat-value">${(fi.views || 0).toLocaleString()}</div></div>
          <div class="ip-stat"><div class="ip-stat-label">좋아요</div><div class="ip-stat-value">${(fi.likes || 0).toLocaleString()}</div></div>
          <div class="ip-stat"><div class="ip-stat-label">댓글</div><div class="ip-stat-value">${(fi.comments || 0).toLocaleString()}</div></div>
          <div class="ip-stat"><div class="ip-stat-label">공유</div><div class="ip-stat-value">${(fi.shares || 0).toLocaleString()}</div></div>

        <span class="ip-toggle">▾</span>
      </summary>
      <div class="ip-body">
        <p class="ip-hint">업로드 후 6일이 지난 시점의 누적 수치를 입력하세요. 명예의 전당 대시보드와 내 성장 그래프에 반영됩니다.</p>
        <div class="ip-input-grid">
          <div class="ip-field">
            <label>조회수</label>
            <input type="number" min="0" id="ip-${m.id}-views" value="${fi.views ?? ''}" placeholder="0">
          </div>
          <div class="ip-field">
            <label>좋아요 ❤️</label>
            <input type="number" min="0" id="ip-${m.id}-likes" value="${fi.likes ?? ''}" placeholder="0">
          </div>
          <div class="ip-field">
            <label>댓글 💬</label>
            <input type="number" min="0" id="ip-${m.id}-comments" value="${fi.comments ?? ''}" placeholder="0">
          </div>
          <div class="ip-field">
            <label>공유 🔁</label>
            <input type="number" min="0" id="ip-${m.id}-shares" value="${fi.shares ?? ''}" placeholder="0">
          </div>
          <div class="ip-field">
            <label>저장 🔖</label>
            <input type="number" min="0" id="ip-${m.id}-saves" value="${fi.saves ?? ''}" placeholder="0">
          </div>
        </div>
        <div class="ip-actions">
          <button class="btn btn-primary btn-sm" onclick="saveMissionInsight('${m.id}')">${hasInsight ? '수정 저장' : '인사이트 등록'}</button>
          ${hasInsight ? `<button class="btn btn-ghost btn-sm" onclick="clearMissionInsight('${m.id}')">초기화</button>` : ''}
          ${hasInsight ? `<span class="ip-updated">최근 갱신: ${formatTime(fi.recordedAt)}</span>` : ''}
        </div>
      </div>
    </details>
  `;
}

async function saveMissionInsight(missionId) {
  const m = State.data.missions.find(x => x.id === missionId);
  if (!m) return;
  const me = getCurrentParticipant();
  if (State.user.role !== 'admin' && (!me || me.id !== m.participantId)) {
    toast('본인 미션만 인사이트를 입력할 수 있습니다.');
    return;
  }
  const get = (k) => {
    const v = parseInt(document.getElementById(`ip-${missionId}-${k}`).value, 10);
    return isNaN(v) ? 0 : Math.max(0, v);
  };
  m.finalInsight = {
    views: get('views'),
    likes: get('likes'),
    comments: get('comments'),
    shares: get('shares'),
    saves: get('saves'),
    recordedAt: Date.now()
  };
  await Storage.set('missions', State.data.missions);
  toast('인사이트가 저장되었습니다.');
  renderGroupContent();
}

async function clearMissionInsight(missionId) {
  if (!confirm('이 미션의 인사이트를 초기화할까요?')) return;
  const m = State.data.missions.find(x => x.id === missionId);
  if (!m) return;
  delete m.finalInsight;
  await Storage.set('missions', State.data.missions);
  toast('초기화 완료');
  renderGroupContent();
}

window.saveMissionInsight = saveMissionInsight;
window.clearMissionInsight = clearMissionInsight;

window.toggleComments = (mid) => {
  document.getElementById('comments-' + mid).classList.toggle('hidden');
};

async function toggleLike(missionId) {
  const me = getCurrentParticipant();
  if (!me) return;
  const existing = State.data.likes.find(l => l.missionId === missionId && l.participantId === me.id);
  if (existing) {
    State.data.likes = State.data.likes.filter(l => !(l.missionId === missionId && l.participantId === me.id));
  } else {
    State.data.likes.push({ id: uid('l'), missionId, participantId: me.id, createdAt: Date.now() });
  }
  await Storage.set('likes', State.data.likes);
  // Update just the button without full re-render
  const card = document.getElementById('mission-' + missionId);
  if (card) {
    const btn = card.querySelector('.like-btn');
    const count = State.data.likes.filter(l => l.missionId === missionId).length;
    const liked = !existing;
    btn.classList.toggle('liked', liked);
    btn.innerHTML = `${liked ? '❤️' : '🤍'} <span class="like-count">${count}</span>`;
  }
}
window.toggleLike = toggleLike;

function renderCommentTree(c, allComments) {
  const isAdminAuthor = c.participantId === 'admin';
  const isAnon = c.anonymous && !isAdminAuthor;
  const p = getParticipant(c.participantId);
  let authorName;
  if (isAdminAuthor) authorName = '구역장 ⚡';
  else if (isAnon) authorName = '익명의 누군가';
  else authorName = p ? p.activity : '익명';
  const replies = allComments.filter(x => x.parentId === c.id);
  const me = getCurrentParticipant();
  const isMyComment = me && me.id === c.participantId;
  const canDelete = State.user.role === 'admin' || isMyComment;
  // Admin badge for anonymous comments so admin can see who it really is (moderation only)
  const adminAnonHint = (State.user.role === 'admin' && isAnon) ? ` <span style="color:var(--ink-mute); font-size:10px;">(${escapeHtml(p ? p.activity : '?')})</span>` : '';

  return `
    <div class="comment">
      <div class="comment-head">
        <span class="comment-author" ${isAdminAuthor ? 'style="color:var(--accent)"' : isAnon ? 'style="color:var(--ink-mute); font-style:italic;"' : ''}>${escapeHtml(authorName)}${adminAnonHint}</span>
        <span class="comment-time">${formatTime(c.createdAt)}</span>
      </div>
      <div class="comment-body">${escapeHtml(c.content)}</div>
      <div class="comment-actions">
        <button onclick="toggleReplyInput('${c.id}')">↳ 답글</button>
        ${canDelete ? `<button onclick="deleteComment('${c.id}', '${c.missionId}')">삭제</button>` : ''}
      </div>
      <div class="comment-input-row hidden" id="reply-input-${c.id}">
        <input class="input" id="rinput-${c.id}" placeholder="답글 남기기...">
        <label class="anon-toggle"><input type="checkbox" id="ranon-${c.id}"> 익명</label>
        <button class="btn btn-primary btn-sm" onclick="submitComment('${c.missionId}', '${c.id}')">등록</button>
      </div>
      ${replies.map(r => renderReply(r)).join('')}
    </div>
  `;
}
function renderReply(c) {
  const isAdminAuthor = c.participantId === 'admin';
  const isAnon = c.anonymous && !isAdminAuthor;
  const p = getParticipant(c.participantId);
  let authorName;
  if (isAdminAuthor) authorName = '구역장 ⚡';
  else if (isAnon) authorName = '익명의 누군가';
  else authorName = p ? p.activity : '익명';
  const me = getCurrentParticipant();
  const canDelete = State.user.role === 'admin' || (me && me.id === c.participantId);
  const adminAnonHint = (State.user.role === 'admin' && isAnon) ? ` <span style="color:var(--ink-mute); font-size:10px;">(${escapeHtml(p ? p.activity : '?')})</span>` : '';
  return `
    <div class="comment reply">
      <div class="comment-head">
        <span class="comment-author" ${isAdminAuthor ? 'style="color:var(--accent)"' : isAnon ? 'style="color:var(--ink-mute); font-style:italic;"' : ''}>${escapeHtml(authorName)}${adminAnonHint}</span>
        <span class="comment-time">${formatTime(c.createdAt)}</span>
      </div>
      <div class="comment-body">${escapeHtml(c.content)}</div>
      ${canDelete ? `<div class="comment-actions"><button onclick="deleteComment('${c.id}', '${c.missionId}')">삭제</button></div>` : ''}
    </div>
  `;
}

window.toggleReplyInput = (cid) => {
  document.getElementById('reply-input-' + cid).classList.toggle('hidden');
};

async function submitComment(missionId, parentId) {
  const isAdmin = State.user.role === 'admin';
  const inputId = parentId ? 'rinput-' + parentId : 'cinput-' + missionId;
  const anonId = parentId ? 'ranon-' + parentId : 'canon-' + missionId;
  const inp = document.getElementById(inputId);
  const anonBox = document.getElementById(anonId);
  const anonymous = !isAdmin && anonBox && anonBox.checked;
  const text = inp.value.trim();
  if (!text) return;
  const c = {
    id: uid('c'), missionId, parentId: parentId || null,
    participantId: isAdmin ? 'admin' : State.user.id,
    content: text, createdAt: Date.now(),
    anonymous: anonymous
  };
  State.data.comments.push(c);
  await Storage.set('comments', State.data.comments);
  inp.value = '';
  renderGroupContent();
  const m = document.getElementById('comments-' + missionId);
  if (m) m.classList.remove('hidden');
}
window.submitComment = submitComment;

async function deleteComment(cid, missionId) {
  if (!confirm('이 댓글을 삭제하시겠습니까?')) return;
  State.data.comments = State.data.comments.filter(x => x.id !== cid && x.parentId !== cid);
  await Storage.set('comments', State.data.comments);
  renderGroupContent();
  const m = document.getElementById('comments-' + missionId);
  if (m) m.classList.remove('hidden');
}
window.deleteComment = deleteComment;

function editMission(mid) {
  const m = State.data.missions.find(x => x.id === mid);
  if (!m) return;
  openModal({
    title: '미션 수정',
    body: `
      <div class="field"><label>제목</label><input class="input" id="em-title" value="${escapeHtml(m.title)}"></div>
      <div class="field"><label>링크</label><input class="input" id="em-url" value="${escapeHtml(m.url)}"></div>
      <div class="input-row">
        <div class="field"><label>유형</label>
          <select class="select" id="em-type">
            <option value="reels" ${m.type==='reels'?'selected':''}>릴스</option>
            <option value="feed" ${m.type==='feed'?'selected':''}>피드</option>
          </select>
        </div>
        <div class="field"><label>주차</label>
          <select class="select" id="em-week">
            ${[1,2,3,4,5,6].map(w => `<option value="${w}" ${w===m.week?'selected':''}>${w}주차</option>`).join('')}
          </select>
        </div>
      </div>
    `,
    actions: [
      { label: '취소', class: 'btn-ghost', onclick: closeModal },
      { label: '저장', class: 'btn-primary', onclick: async () => {
        m.title = document.getElementById('em-title').value.trim();
        m.url = document.getElementById('em-url').value.trim();
        m.type = document.getElementById('em-type').value;
        m.week = parseInt(document.getElementById('em-week').value, 10);
        await Storage.set('missions', State.data.missions);
        closeModal(); toast('수정되었습니다.', 'success'); renderGroupContent();
      }}
    ]
  });
}
window.editMission = editMission;

async function deleteMission(mid) {
  if (!confirm('이 미션을 삭제하시겠습니까? 관련 댓글과 인사이트도 함께 삭제됩니다.')) return;
  State.data.missions = State.data.missions.filter(x => x.id !== mid);
  State.data.comments = State.data.comments.filter(x => x.missionId !== mid);
  State.data.insights = State.data.insights.filter(x => x.missionId !== mid);
  await Storage.set('missions', State.data.missions);
  await Storage.set('comments', State.data.comments);
  await Storage.set('insights', State.data.insights);
  toast('삭제되었습니다.', 'success');
  renderGroupContent();
}
window.deleteMission = deleteMission;
</script>

/* ========================================================
   STORAGE LAYER (with cache + fallback)
   ======================================================== */
/* --------------------------------------------------------
   STORAGE LAYER — REAL-TIME SYNC BETWEEN WEB & APP
   --------------------------------------------------------
   Strategy:
   1. Shared writes go to window.storage(shared:true) → visible to ALL devices/users
   2. Polling every ~2.5s fetches all keys, compares hashes, detects changes
   3. BroadcastChannel + storage event give instant sync across same-origin tabs
   4. visibilitychange / focus / online events trigger immediate re-sync
   5. When changes detected → State.data refreshed → current view re-rendered
   -------------------------------------------------------- */
const Storage = {
  cache: {},                      // last-known value per key
  hashes: {},                     // hash of last-known value (for change detection)
  available: typeof window.storage !== 'undefined',
  bc: null,                       // BroadcastChannel for instant same-origin sync
  syncTimer: null,
  syncCallbacks: [],              // subscribers notified on remote changes
  isPolling: false,
  lastPollAt: 0,
  POLL_INTERVAL: 2500,            // ms — gentle but responsive

  // Keys that represent shared state (everything except per-device session)
  SYNC_KEYS: [
    'groups','participants','announcements','notices',
    'missions','comments','insights','expenses','likes',
    'config','defaultFee'
  ],

  // Compact, stable hash for change detection (djb2 variant)
  hash(value) {
    if (value === null || value === undefined) return '_null_';
    const s = JSON.stringify(value);
    let h = 5381;
    for (let i = 0; i < s.length; i++) {
      h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    }
    return h + ':' + s.length;
  },

  // Read from cache if warm, otherwise fetch
  async get(key) {
    if (this.cache[key] !== undefined) return this.cache[key];
    const val = await this.fetchFresh(key);
    this.cache[key] = val;
    this.hashes[key] = this.hash(val);
    return val;
  },

  // Force a fresh fetch from underlying store (bypass cache)
  async fetchFresh(key) {
    if (!this.available) {
      try {
        const v = localStorage.getItem('ssj_'+key);
        return v ? JSON.parse(v) : null;
      } catch(e) { return null; }
    }
    try {
      const res = await window.storage.get(key, true);
      return res ? JSON.parse(res.value) : null;
    } catch(e) { return null; }
  },

  async set(key, value) {
    this.cache[key] = value;
    this.hashes[key] = this.hash(value);

    // Instant signal to other tabs on this origin
    try { this.bc && this.bc.postMessage({ type: 'set', key, t: Date.now() }); } catch(e) {}

    if (!this.available) {
      try {
        localStorage.setItem('ssj_'+key, JSON.stringify(value));
        return true;
      } catch(e) { return false; }
    }
    try {
      await window.storage.set(key, JSON.stringify(value), true);
      return true;
    } catch(e) {
      console.error('Storage set failed:', e);
      return false;
    }
  },

  async delete(key) {
    delete this.cache[key];
    delete this.hashes[key];
    try { this.bc && this.bc.postMessage({ type: 'delete', key, t: Date.now() }); } catch(e) {}
    if (!this.available) {
      try { localStorage.removeItem('ssj_'+key); return true; } catch(e) { return false; }
    }
    try { await window.storage.delete(key, true); return true; } catch(e) { return false; }
  },

  // Register a callback for remote changes — receives an array of changed keys
  onChange(cb) { this.syncCallbacks.push(cb); },

  // One pass: fetch every sync key, detect diffs, fire callbacks if changed
  async pollOnce() {
    if (this.isPolling) return [];
    this.isPolling = true;
    const changed = [];
    try {
      const results = await Promise.all(
        this.SYNC_KEYS.map(k =>
          this.fetchFresh(k).then(v => [k, v]).catch(() => [k, undefined])
        )
      );
      for (const [key, val] of results) {
        if (val === undefined) continue;  // fetch error → keep current cache
        const newHash = this.hash(val);
        if (newHash !== this.hashes[key]) {
          // Guard: don't accept "null" if we already have real data (transient read-after-write race)
          const have = this.cache[key];
          if (val === null && have != null && (
            (Array.isArray(have) && have.length > 0) ||
            (typeof have === 'object' && Object.keys(have).length > 0)
          )) {
            continue;
          }
          this.cache[key] = val;
          this.hashes[key] = newHash;
          changed.push(key);
        }
      }
      this.lastPollAt = Date.now();
      if (changed.length > 0) {
        for (const cb of this.syncCallbacks) {
          try { cb(changed); } catch(e) { console.error('sync callback error', e); }
        }
      }
    } catch(e) {
      console.error('Storage poll failed:', e);
    } finally {
      this.isPolling = false;
    }
    return changed;
  },

  startSync() {
    // 1) Same-origin instant sync via BroadcastChannel
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        this.bc = new BroadcastChannel('ssj_sync_v1');
        this.bc.onmessage = () => {
          // Another tab on this origin wrote — re-poll quickly
          setTimeout(() => this.pollOnce(), 80);
        };
      } catch(e) {}
    }

    // 2) Cross-tab via storage event (works when fallback path uses localStorage)
    try {
      window.addEventListener('storage', (e) => {
        if (e.key && e.key.startsWith('ssj_') && !e.key.startsWith('ssj_local_')) {
          setTimeout(() => this.pollOnce(), 50);
        }
      });
    } catch(e) {}

    // 3) Visibility / focus / online — eager refresh when user returns to tab
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) this.pollOnce();
    });
    window.addEventListener('focus', () => this.pollOnce());
    window.addEventListener('online', () => this.pollOnce());

    // 4) Periodic poll (recursive setTimeout — never stacks, always paced)
    const tick = () => {
      this.syncTimer = setTimeout(async () => {
        if (!document.hidden) {
          await this.pollOnce();
        }
        tick();
      }, this.POLL_INTERVAL);
    };
    tick();
  },

  stopSync() {
    if (this.syncTimer) { clearTimeout(this.syncTimer); this.syncTimer = null; }
    if (this.bc) { try { this.bc.close(); } catch(e) {} this.bc = null; }
  }
};

// Local-only storage for per-device session (never shared)
const LocalStore = {
  get(key) {
    try { const v = localStorage.getItem('ssj_local_'+key); return v ? JSON.parse(v) : null; } catch(e) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem('ssj_local_'+key, JSON.stringify(value)); return true; } catch(e) { return false; }
  },
  delete(key) {
    try { localStorage.removeItem('ssj_local_'+key); return true; } catch(e) { return false; }
  }
};

/* ========================================================
   INITIALIZATION
   ======================================================== */
async function initApp() {
  State.data.groups = (await Storage.get('groups')) || SEED_GROUPS;
  State.data.participants = (await Storage.get('participants')) || SEED_PARTICIPANTS;
  State.data.announcements = (await Storage.get('announcements')) || SEED_ANNOUNCEMENTS;
  State.data.notices = (await Storage.get('notices')) || SEED_NOTICES;
  State.data.missions = (await Storage.get('missions')) || [];
  State.data.comments = (await Storage.get('comments')) || [];
  State.data.insights = (await Storage.get('insights')) || [];
  State.data.expenses = (await Storage.get('expenses')) || [];
  State.data.likes = (await Storage.get('likes')) || [];
  State.data.config = (await Storage.get('config')) || DEFAULT_CONFIG;
  State.data.defaultFee = (await Storage.get('defaultFee')) || 0;

  // Migration: rename g5 "관계와 감성" → "커플/결혼/리뷰"
  const g5 = State.data.groups.find(g => g.id === 'g5');
  if (g5 && g5.name === '관계와 감성') {
    g5.name = '커플/결혼/리뷰';
    g5.category = '커플/결혼/리뷰';
    g5.desc = 'COUPLES, WEDDING & REVIEWS';
  }

  await Storage.set('groups', State.data.groups);
  await Storage.set('participants', State.data.participants);
  await Storage.set('announcements', State.data.announcements);
  await Storage.set('notices', State.data.notices);
  await Storage.set('config', State.data.config);

  // ──────────────────────────────────────────────────────────
  // REAL-TIME SYNC: seed change-detection hashes, wire callback,
  // start polling. From now on any remote write (web or app) is
  // detected within ~2.5s (or instantly on visibility/focus).
  // ──────────────────────────────────────────────────────────
  for (const k of Storage.SYNC_KEYS) {
    Storage.hashes[k] = Storage.hash(Storage.cache[k]);
  }
  Storage.onChange(applyRemoteChanges);
  Storage.startSync();

  // Auto-restore session from local device storage
  const session = LocalStore.get('session');
  if (session && session.role === 'admin') {
    State.user = { id: 'admin', role: 'admin' };
    enterApp();
    return;
  }
  if (session && session.id) {
    const p = getParticipant(session.id);
    if (p) {
      State.user = { id: p.id, role: 'member' };
      enterApp();
      return;
    }
  }

  renderLoginScreen();
}

function enterApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  setupAppShell();
  switchTab('big');
}

/* ========================================================
   UTILITIES
   ======================================================== */
function uid(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTime(ts) {
  const d = new Date(ts);
  const diff = Date.now() - ts;
  if (diff < 60000) return '방금';
  if (diff < 3600000) return Math.floor(diff/60000) + '분 전';
  if (diff < 86400000) return Math.floor(diff/3600000) + '시간 전';
  if (diff < 86400000 * 7) return Math.floor(diff/86400000) + '일 전';
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}
function formatDate(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}
function formatMoney(n) {
  if (n == null) return '0';
  return Math.round(n).toLocaleString('ko-KR');
}
function initials(name) { return name ? name.slice(0,1) : '?'; }
function getParticipant(id) { return State.data.participants.find(p => p.id === id); }
function getGroup(id) { return State.data.groups.find(g => g.id === id); }
function getCurrentParticipant() {
  if (State.user.role === 'admin') return null;
  return getParticipant(State.user.id);
}
function ensureUrl(url) {
  if (!url) return '#';
  if (!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
}

function toast(msg, type = 'info') {
  const zone = document.getElementById('toast-zone');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  zone.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
}

/* ========================================================
   REAL-TIME SYNC GLUE
   Bridges Storage cache → State.data → on-screen re-render
   ======================================================== */
function applyRemoteChanges(changedKeys) {
  if (!changedKeys || changedKeys.length === 0) return;

  // 1. Pull new values from Storage cache into State.data
  for (const key of changedKeys) {
    const v = Storage.cache[key];
    if (key === 'config') {
      State.data.config = v || State.data.config || DEFAULT_CONFIG;
    } else if (key === 'defaultFee') {
      State.data.defaultFee = (v != null) ? v : (State.data.defaultFee || 0);
    } else if (key in State.data) {
      // List-shaped data: fall back to [] if remote is null
      State.data[key] = v || (Array.isArray(State.data[key]) ? [] : (State.data[key] || null));
    }
  }

  // 2. If logged-in participant was deleted remotely, drop them to login screen
  if (State.user && State.user.role !== 'admin') {
    const still = State.data.participants.find(p => p.id === State.user.id);
    if (!still) {
      LocalStore.delete('session');
      State.user = null;
      const appEl = document.getElementById('app');
      const loginEl = document.getElementById('login-screen');
      if (appEl) appEl.classList.add('hidden');
      if (loginEl) loginEl.classList.remove('hidden');
      renderLoginScreen();
      toast('계정 정보가 변경되어 로그인 화면으로 이동합니다.', 'info');
      return;
    }
  }

  // 3. Re-render whichever surface is currently visible
  const appHidden = document.getElementById('app')?.classList.contains('hidden');
  if (appHidden) {
    // We're on the login screen — refresh the participant chips list
    try { renderLoginScreen(); } catch(e) {}
  } else {
    rerenderCurrentView();
  }

  // 4. Show a subtle visual confirmation
  showSyncPulse(changedKeys);
}

function rerenderCurrentView() {
  const m = document.getElementById('main-view');
  if (!m) return;

  // Never disrupt an open modal — modal owns its own state
  if (document.getElementById('modal-backdrop')) return;

  // Never yank focus from a user actively typing — defer until they're idle
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
    return;
  }

  const scrollY = window.scrollY;
  const id = State.currentTab;
  m.innerHTML = '';
  try {
    if (id === 'big') renderBigZone(m);
    else if (id === 'small') renderSmallZone(m);
    else if (id === 'fame') renderHallOfFame(m);
    else if (id === 'insight') renderMyInsights(m);
    else if (id === 'admin') renderAdmin(m);
  } catch(e) {
    console.error('rerenderCurrentView failed:', e);
  }
  // Restore scroll without smooth animation (instant feels better here)
  window.scrollTo(0, scrollY);
}

function showSyncPulse(keys) {
  let el = document.getElementById('sync-pulse');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sync-pulse';
    document.body.appendChild(el);
  }
  const labelMap = {
    missions: '미션', comments: '피드백', insights: '인사이트',
    likes: '좋아요', participants: '멤버', announcements: '공지',
    notices: '알림', groups: '조', expenses: '지출',
    config: '시즌 설정', defaultFee: '회비'
  };
  const labels = keys.map(k => labelMap[k] || k).slice(0, 3);
  const more = keys.length > 3 ? ` +${keys.length - 3}` : '';
  el.innerHTML = `<span class="sp-dot"></span> SYNCED · ${labels.join(' · ')}${more}`;
  el.classList.add('visible');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('visible'), 1800);
}

/* ========================================================
   LOGIN SCREEN
   ======================================================== */
function renderLoginScreen() {
  const list = document.getElementById('member-list');
  const members = [...State.data.participants].sort((a,b) => a.activity.localeCompare(b.activity, 'ko'));
  list.innerHTML = members.map(p => `
    <button class="member-chip" onclick="loginAs('${p.id}')">
      <span class="activity">${escapeHtml(p.activity)}</span>
      <span class="real-name">${escapeHtml(p.realName)}</span>
    </button>
  `).join('');
  document.getElementById('goto-admin').onclick = () => openAdminLoginModal();
}

function getPhoneLast4(phone) {
  return String(phone || '').replace(/\D/g, '').slice(-4);
}

function loginAs(participantId) {
  const p = getParticipant(participantId);
  if (!p) return;
  const last4 = getPhoneLast4(p.phone);

  // If no phone digits available (data integrity), fall back to direct login with warning
  if (!last4 || last4.length < 4) {
    confirmLogin(participantId);
    return;
  }

  openModal({
    title: `${p.activity} 본인 확인`,
    body: `
      <p style="margin-bottom:14px; font-size:13px; color:var(--ink-soft);">
        본인 확인을 위해 <strong style="color:var(--accent);">등록된 휴대전화 끝 4자리</strong>를 입력해주세요.
      </p>
      <div class="field">
        <label>PIN (휴대전화 끝 4자리)</label>
        <input type="tel" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="input" id="pin-input" placeholder="0000" autocomplete="off" autofocus style="font-family:var(--font-mono-display); font-size:24px; letter-spacing:0.4em; text-align:center;">
        <div id="pin-error" style="display:none; color:var(--bad); font-size:12px; margin-top:8px; font-family:var(--font-mono-display); letter-spacing:0.1em;">PIN이 일치하지 않습니다.</div>
      </div>
      <p style="font-size:11px; color:var(--ink-mute); margin-top:8px;">
        ※ 잘못 등록된 번호로 들어갈 수 없으면 구역장에게 문의해주세요.
      </p>
    `,
    actions: [
      { label: '취소', class: 'btn-ghost', onclick: closeModal },
      { label: '입장', class: 'btn-primary', onclick: () => tryParticipantLogin(participantId) }
    ]
  });
  setTimeout(() => {
    const inp = document.getElementById('pin-input');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryParticipantLogin(participantId); });
      inp.addEventListener('input', () => {
        const err = document.getElementById('pin-error');
        if (err) err.style.display = 'none';
      });
    }
  }, 50);
}

function tryParticipantLogin(participantId) {
  const p = getParticipant(participantId);
  if (!p) return;
  const expected = getPhoneLast4(p.phone);
  const entered = (document.getElementById('pin-input').value || '').trim();
  if (entered === expected) {
    closeModal();
    confirmLogin(participantId);
  } else {
    const err = document.getElementById('pin-error');
    if (err) err.style.display = 'block';
    const inp = document.getElementById('pin-input');
    if (inp) { inp.value = ''; inp.focus(); }
  }
}

function confirmLogin(participantId) {
  State.user = { id: participantId, role: 'member' };
  LocalStore.set('session', { id: participantId, role: 'member' });
  enterApp();
}

function loginAdmin() {
  State.user = { id: 'admin', role: 'admin' };
  LocalStore.set('session', { id: 'admin', role: 'admin' });
  enterApp();
}

function openAdminLoginModal() {
  openModal({
    title: '구역장 인증',
    body: `
      <p style="margin-bottom:14px; font-size:13px; color:var(--ink-soft);">관리자 비밀번호를 입력하세요</p>
      <div class="field">
        <input type="password" class="input" id="admin-pw" placeholder="비밀번호" autofocus>
      </div>
    `,
    actions: [
      { label: '취소', class: 'btn-ghost', onclick: () => closeModal() },
      { label: '입장', class: 'btn-primary', onclick: () => tryAdminLogin() }
    ]
  });
  setTimeout(() => {
    const inp = document.getElementById('admin-pw');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryAdminLogin(); });
    }
  }, 50);
}
function tryAdminLogin() {
  const pw = document.getElementById('admin-pw').value;
  if (pw === '137202') { closeModal(); loginAdmin(); }
  else toast('비밀번호가 틀렸습니다.', 'error');
}

function logout() {
  LocalStore.delete('session');
  State.user = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  renderLoginScreen();
}

function setupAppShell() {
  const isAdmin = State.user.role === 'admin';
  const p = isAdmin ? null : getCurrentParticipant();

  document.getElementById('user-activity').textContent = isAdmin ? '구역장' : p.activity;
  const role = document.getElementById('user-role');
  role.textContent = isAdmin ? 'ADMIN' : p.realName;
  role.className = isAdmin ? 'role admin' : 'role';

  const av = document.getElementById('user-avatar');
  av.textContent = isAdmin ? '⚡' : initials(p.activity);
  av.className = isAdmin ? 'avatar admin' : 'avatar';

  const profileBtn = document.getElementById('profile-btn');
  if (profileBtn) profileBtn.style.display = isAdmin ? 'none' : '';

  const tabs = [
    { id: 'big', label: '대구역' },
    { id: 'small', label: '소구역' },
    { id: 'fame', label: '명예의 전당' },
    { id: 'insight', label: '내 인사이트' }
  ];
  if (isAdmin) tabs.push({ id: 'admin', label: '관리자' });
  document.getElementById('tab-bar').innerHTML = tabs.map(t =>
    `<button class="tab-btn" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');

  // Default current group to user's own group
  if (!isAdmin) State.currentGroup = p.groupId;
}

function switchTab(id) {
  State.currentTab = id;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === id);
  });
  const m = document.getElementById('main-view');
  m.innerHTML = '';
  if (id === 'big') renderBigZone(m);
  else if (id === 'small') renderSmallZone(m);
  else if (id === 'fame') renderHallOfFame(m);
  else if (id === 'insight') renderMyInsights(m);
  else if (id === 'admin') renderAdmin(m);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openModal({ title, body, actions, wide = false }) {
  const root = document.getElementById('modal-root');
  const actionsHtml = (actions || []).map((a, i) =>
    `<button class="btn ${a.class || ''}" data-action-i="${i}">${a.label}</button>`
  ).join('');
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal ${wide ? 'wide' : ''}" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        ${actions ? `<div class="modal-foot">${actionsHtml}</div>` : ''}
      </div>
    </div>
  `;
  if (actions) {
    document.querySelectorAll('[data-action-i]').forEach(btn => {
      const idx = parseInt(btn.dataset.actionI);
      btn.onclick = actions[idx].onclick;
    });
  }
  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

function openImageLightbox(src) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" onclick="closeModal()">
      <img src="${src}" class="lightbox-img" onclick="event.stopPropagation()">
    </div>
  `;
}

function computeParticipantScores(metric) {
  return State.data.participants.map(p => {
    const myMissions = State.data.missions.filter(m => m.participantId === p.id);
    let total = 0, views = 0, comments = 0, saves = 0, shares = 0, insightLikes = 0, appLikes = 0;
    myMissions.forEach(m => {
      const fi = m.finalInsight;
      if (fi) {
        views += fi.views || 0;
        comments += fi.comments || 0;
        saves += fi.saves || 0;
        shares += fi.shares || 0;
        insightLikes += fi.likes || 0;
      }
      appLikes += State.data.likes.filter(l => l.missionId === m.id).length;
    });
    total = views + insightLikes + comments + saves + shares;
    const map = { total, views, likes: insightLikes, comments, saves, shares, appLikes };
    return {
      participant: p,
      missionCount: myMissions.length,
      reportedMissions: myMissions.filter(m => m.finalInsight).length,
      score: map[metric] || 0,
      all: map
    };
  }).sort((a, b) => b.score - a.score);
}

function getMissionScore(missionId) {
  const m = State.data.missions.find(x => x.id === missionId);
  if (!m || !m.finalInsight) return 0;
  const fi = m.finalInsight;
  return (fi.views || 0) + (fi.likes || 0) + (fi.comments || 0) + (fi.saves || 0) + (fi.shares || 0);
}

function renderWeeklyBest() {
  const cw = getCurrentWeek();
  if (!cw || cw.pre) return '';
  const wMissions = State.data.missions.filter(m => m.week === cw.weekNum);
  if (!wMissions.length) {
    return `
      <div class="weekly-best-card empty-best">
        <div class="wb-eyebrow">WEEK ${cw.weekNum} 베스트</div>
        <div class="wb-msg">아직 ${cw.weekNum}주차에 업로드된 미션이 없습니다.</div>
      </div>
    `;
  }
  const scored = wMissions.map(m => ({ m, score: getMissionScore(m.id), likes: State.data.likes.filter(l => l.missionId === m.id).length }));
  scored.sort((a, b) => (b.score - a.score) || (b.likes - a.likes));
  const top = scored[0];
  const p = getParticipant(top.m.participantId);
  if (!p) return '';
  return `
    <div class="weekly-best-card">
      <div class="wb-eyebrow">⭐ WEEK ${cw.weekNum} 베스트 인사이트</div>
      <div class="wb-body">
        <div class="wb-avatar">${initials(p.activity)}</div>
        <div class="wb-content">
          <div class="wb-author">${escapeHtml(p.activity)} <span class="wb-real">${escapeHtml(p.realName)}</span></div>
          <div class="wb-title">${escapeHtml(top.m.title)}</div>
          <div class="wb-stats">
            <span>총합 ${top.score.toLocaleString()}</span>
            <span>❤️ ${top.likes}</span>
            <span>${top.m.type === 'reels' ? 'REELS' : 'FEED'}</span>
          </div>
        </div>
        <a href="${ensureUrl(top.m.url)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">콘텐츠 보기 ↗</a>
      </div>
    </div>
  `;
}

function renderAttendanceMatrix() {
  const cfg = getConfig();
  const weeks = getSeasonWeeks();
  const target = cfg.weeklyTarget || 2;
  const participants = [...State.data.participants].sort((a,b) => a.activity.localeCompare(b.activity, 'ko'));

  // Header row
  const headerCells = weeks.map(w => `<th>W${w.weekNum}</th>`).join('');
  // Body rows
  const rows = participants.map(p => {
    const cells = weeks.map(w => {
      const count = State.data.missions.filter(m => m.participantId === p.id && m.week === w.weekNum).length;
      let cls = 'cell-miss';
      let label = String(count);
      if (count >= target) cls = 'cell-hit';
      else if (count > 0) cls = 'cell-partial';
      return `<td class="att-cell ${cls}" title="${escapeHtml(p.activity)} · W${w.weekNum}: ${count}개">${label}</td>`;
    }).join('');
    const total = State.data.missions.filter(m => m.participantId === p.id).length;
    return `<tr><td class="att-name">${escapeHtml(p.activity)}</td>${cells}<td class="att-total">${total}</td></tr>`;
  }).join('');

  // Summary: total expected = target × totalWeeks × participants
  const totalUploaded = State.data.missions.length;
  const fullAchievers = participants.filter(p => {
    return weeks.every(w => State.data.missions.filter(m => m.participantId === p.id && m.week === w.weekNum).length >= target);
  }).length;

  return `
    <div class="attendance-block">
      <div class="att-header-row">
        <h3 class="block-title" style="margin-bottom:0">📋 출석 & 참여율</h3>
        <div class="att-summary">
          <span>전체 ${totalUploaded}개 업로드</span>
          <span>주간 목표 ${target}개</span>
          <span>완주자 ${fullAchievers} / ${participants.length}</span>
        </div>
      </div>
      <div class="att-legend">
        <span><span class="dot cell-hit"></span>목표 달성</span>
        <span><span class="dot cell-partial"></span>부분 달성</span>
        <span><span class="dot cell-miss"></span>미달</span>
      </div>
      <div class="att-wrap">
        <table class="attendance-table">
          <thead><tr><th>참가자</th>${headerCells}<th>합계</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function computeAggregateStats() {
  let totalViews = 0, totalLikes = 0, totalComments = 0, totalShares = 0, totalSaves = 0;
  let reportedMissions = 0;
  State.data.missions.forEach(m => {
    if (m.finalInsight) {
      reportedMissions++;
      totalViews += m.finalInsight.views || 0;
      totalLikes += m.finalInsight.likes || 0;
      totalComments += m.finalInsight.comments || 0;
      totalShares += m.finalInsight.shares || 0;
      totalSaves += m.finalInsight.saves || 0;
    }
  });
  const totalMissions = State.data.missions.length;
  const totalParticipants = State.data.participants.length;
  const activeCreators = new Set(State.data.missions.filter(m => m.finalInsight).map(m => m.participantId)).size;
  return {
    totalViews, totalLikes, totalComments, totalShares, totalSaves,
    grandTotal: totalViews + totalLikes + totalComments + totalShares + totalSaves,
    totalMissions, reportedMissions, totalParticipants, activeCreators,
    avgViewsPerMission: reportedMissions ? Math.round(totalViews / reportedMissions) : 0
  };
}

function renderFollowerLeaderboard() {
  const entries = State.data.participants
    .map(p => {
      const b = p.followerBefore;
      const a = p.followerAfter;
      if (!b || !a || b.count == null || a.count == null) return null;
      const diff = a.count - b.count;
      const pct = b.count > 0 ? Math.round((diff / b.count) * 1000) / 10 : null;
      return { participant: p, before: b.count, after: a.count, diff, pct };
    })
    .filter(Boolean)
    .sort((a, b) => b.diff - a.diff);

  // Aggregate growth for tile
  const totalGrowth = entries.reduce((s, e) => s + e.diff, 0);
  const totalParticipants = State.data.participants.length;

  if (entries.length === 0) {
    return `
      <div class="follower-board">
        <h3 class="block-title" style="margin-bottom:12px;">📈 BEFORE / AFTER · 팔로워 성장</h3>
        <div class="no-data-msg">
          <span class="em">NO DATA YET</span>
          참가자들이 시즌 시작·종료 시점의 인증샷을 등록하면 여기에 성장 랭킹이 표시됩니다.
        </div>
      </div>
    `;
  }

  const rows = entries.map((e, i) => {
    const cls = e.diff > 0 ? 'up' : e.diff < 0 ? 'down' : 'flat';
    const arrow = e.diff > 0 ? '▲' : e.diff < 0 ? '▼' : '—';
    const sign = e.diff >= 0 ? '+' : '';
    return `
      <div class="fbl-row ${i < 3 ? 'top-3' : ''}">
        <div class="fbl-rank">${i + 1}</div>
        <div class="fbl-who">
          <div class="name">${escapeHtml(e.participant.activity)}</div>
          <div class="real">${escapeHtml(e.participant.realName)}</div>
        </div>
        <div class="fbl-before">시작 ${e.before.toLocaleString()}</div>
        <div class="fbl-after">→ ${e.after.toLocaleString()}</div>
        <div class="fbl-delta ${cls}">
          ${arrow} ${sign}${e.diff.toLocaleString()}
          ${e.pct != null ? `<span class="pct">${sign}${e.pct}%</span>` : ''}
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="follower-board">
      <div class="att-header-row">
        <h3 class="block-title" style="margin-bottom:0;">📈 BEFORE / AFTER · 팔로워 성장</h3>
        <div class="att-summary">
          <span>총 증가 ${totalGrowth >= 0 ? '+' : ''}${totalGrowth.toLocaleString()}명</span>
          <span>등록 ${entries.length} / ${totalParticipants}</span>
        </div>
      </div>
      <p style="font-size:12px; color:var(--ink-mute); margin: 8px 0 14px;">참가자들이 직접 등록한 인스타그램 프로필 캡쳐 기반 팔로워 변화입니다.</p>
      <div class="fbl-list">${rows}</div>
    </div>
  `;
}

function renderFameTable() {
  const scores = computeParticipantScores('total').filter(s => s.reportedMissions > 0);
  if (!scores.length) {
    return '<tr><td colspan="9" class="empty-row">아직 인사이트가 등록되지 않았습니다. 소구역 미션 카드에서 6일 누적 인사이트를 입력해보세요.</td></tr>';
  }
  return scores.map((s, i) => {
    const a = s.all;
    return `
      <tr>
        <td style="font-family:var(--font-display); font-weight:var(--font-display-weight); font-size:18px; color:${i < 3 ? 'var(--accent)' : 'var(--ink-mute)'};">${i + 1}</td>
        <td><strong>${escapeHtml(s.participant.activity)}</strong><br><span style="font-size:11px; color:var(--ink-mute);">${escapeHtml(s.participant.realName)}</span></td>
        <td style="font-family:var(--font-mono-display); color:var(--ink-mute);">${s.reportedMissions}/${s.missionCount}</td>
        <td>${a.views.toLocaleString()}</td>
        <td>${a.likes.toLocaleString()}</td>
        <td>${a.comments.toLocaleString()}</td>
        <td>${a.shares.toLocaleString()}</td>
        <td>${a.saves.toLocaleString()}</td>
        <td style="font-family:var(--font-display); font-weight:var(--font-display-weight); color:var(--accent);">${a.total.toLocaleString()}</td>
      </tr>
    `;
  }).join('');
}

function setFameMetric(m) {
  State.currentMetric = m;
  document.querySelectorAll('#fame-tabs .metric-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.fameMetric === m);
  });
  renderFameBody();
}

function renderFameBody() {
  const wrap = document.getElementById('fame-body');
  if (!wrap) return;
  const scores = computeParticipantScores(State.currentMetric).filter(s => s.reportedMissions > 0);

  if (!scores.length) {
    wrap.innerHTML = `
      <div class="no-data-msg">
        <span class="em">NO DATA YET</span>
        아직 인사이트가 입력되지 않았습니다. 소구역에서 미션 카드의 📊 인사이트를 입력해주세요.
      </div>
    `;
    return;
  }

  const top3 = scores.slice(0, 3);
  const rest = scores.slice(3);
  const metricLabel = ({ total:'TOTAL', views:'조회수', likes:'좋아요', comments:'댓글', shares:'공유', saves:'저장' })[State.currentMetric];

  // Podium: 2nd, 1st, 3rd (visual order)
  const order = [top3[1], top3[0], top3[2]];
  const klass = ['second', 'first', 'third'];
  const rankNum = [2, 1, 3];

  const podiumHtml = order.map((s, i) => {
    if (!s) return `<div class="podium-pos ${klass[i]}" style="opacity:0.3"><div class="rank-num">${rankNum[i]}</div><div class="activity">—</div><div class="score">NO ENTRY</div></div>`;
    return `
      <div class="podium-pos ${klass[i]}">
        <div class="rank-num">${rankNum[i]}</div>
        <div class="activity">${escapeHtml(s.participant.activity)}</div>
        <div class="score">${metricLabel} · ${s.score.toLocaleString()}</div>
      </div>
    `;
  }).join('');

  const restHtml = rest.map((s, i) => `
    <div class="rank-row">
      <div class="rank-num">${i + 4}</div>
      <div class="who">
        <div class="activity">${escapeHtml(s.participant.activity)}</div>
        <div class="meta">${escapeHtml(s.participant.realName)} · 보고 ${s.reportedMissions}개</div>
      </div>
      <div class="score">${s.score.toLocaleString()}</div>
    </div>
  `).join('');

  wrap.innerHTML = `
    <div class="podium">${podiumHtml}</div>
    ${rest.length ? `<div class="ranking-list">${restHtml}</div>` : ''}
  `;
}

let _chartInstances = {};

function renderMyInsights(host) {
  const isAdmin = State.user.role === 'admin';
  Object.values(_chartInstances).forEach(c => { try { c.destroy(); } catch(e){} });
  _chartInstances = {};

  let targetId;
  if (isAdmin) {
    targetId = State.adminInsightView || State.data.participants[0]?.id;
    State.adminInsightView = targetId;
  } else {
    targetId = State.user.id;
  }

  const participant = getParticipant(targetId);
  if (!participant) {
    host.innerHTML = '<div class="no-data-msg">참가자를 찾을 수 없습니다.</div>';
    return;
  }

  const viewerSelect = isAdmin ? `
    <div class="viewer-select">
      <label>참가자 선택</label>
      <select onchange="setInsightViewer(this.value)">
        ${State.data.participants.map(p => `<option value="${p.id}" ${p.id === targetId ? 'selected' : ''}>${escapeHtml(p.activity)} (${escapeHtml(p.realName)})</option>`).join('')}
      </select>
    </div>
  ` : '';

  // Chronological (oldest → newest) so growth flows naturally left-to-right
  const myMissions = State.data.missions
    .filter(m => m.participantId === targetId)

function computePersonalTotals(missions) {
  const t = { views:0, likes:0, comments:0, shares:0, saves:0, total:0 };
  missions.forEach(m => {
    if (!m.finalInsight) return;
    t.views += m.finalInsight.views || 0;
    t.likes += m.finalInsight.likes || 0;
    t.comments += m.finalInsight.comments || 0;
    t.shares += m.finalInsight.shares || 0;
    t.saves += m.finalInsight.saves || 0;
  });
  t.total = t.views + t.likes + t.comments + t.shares + t.saves;
  return t;
}

function setGrowthMode(mode) {
  State.growthMode = mode;
  document.querySelectorAll('.growth-mode-tabs .metric-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.growth === mode);
  });
  // Re-render chart only
  const isAdmin = State.user.role === 'admin';
  const targetId = isAdmin ? State.adminInsightView : State.user.id;
  const reported = State.data.missions
    .filter(m => m.participantId === targetId && m.finalInsight)
    .sort((a, b) => a.createdAt - b.createdAt);
  renderGrowthChart(reported);
}
window.setGrowthMode = setGrowthMode;

function renderGrowthChart(missionsAsc) {
  const canvas = document.getElementById('growth-chart-main');
  if (!canvas) return;
  if (_chartInstances.main) { try { _chartInstances.main.destroy(); } catch(e){} }

  const mode = State.growthMode || 'absolute';
  const labels = missionsAsc.map(m => `W${m.week}\n${formatDateShort(new Date(m.createdAt))}`);

  // Series builders
  const series = (key) => missionsAsc.map(m => (m.finalInsight && m.finalInsight[key]) || 0);
  // Growth rate: (current - prev) / prev * 100 — null when prev is 0 or first item
  const rate = (key) => {
    const vals = series(key);
    return vals.map((v, i) => {
      if (i === 0 || vals[i-1] === 0) return null;
      return Math.round(((v - vals[i-1]) / vals[i-1]) * 1000) / 10;
    });
  };

  const colors = {
    views: '#ff2a2a', likes: '#ff7eb6', comments: '#ffd23f', shares: '#7ab8ff', saves: '#6bff8a'
  };

  const datasets = mode === 'rate' ? [
    { label: '조회수 증감율', data: rate('views'), borderColor: colors.views, backgroundColor: colors.views + '22', tension: 0.3, spanGaps: true },
    { label: '좋아요 증감율', data: rate('likes'), borderColor: colors.likes, backgroundColor: colors.likes + '22', tension: 0.3, spanGaps: true },
    { label: '댓글 증감율', data: rate('comments'), borderColor: colors.comments, backgroundColor: colors.comments + '22', tension: 0.3, spanGaps: true },
    { label: '공유 증감율', data: rate('shares'), borderColor: colors.shares, backgroundColor: colors.shares + '22', tension: 0.3, spanGaps: true },
    { label: '저장 증감율', data: rate('saves'), borderColor: colors.saves, backgroundColor: colors.saves + '22', tension: 0.3, spanGaps: true }
  ] : [
    { label: '조회수', data: series('views'), borderColor: colors.views, backgroundColor: colors.views + '22', tension: 0.3 },
    { label: '좋아요', data: series('likes'), borderColor: colors.likes, backgroundColor: colors.likes + '22', tension: 0.3 },
    { label: '댓글', data: series('comments'), borderColor: colors.comments, backgroundColor: colors.comments + '22', tension: 0.3 },
    { label: '공유', data: series('shares'), borderColor: colors.shares, backgroundColor: colors.shares + '22', tension: 0.3 },
    { label: '저장', data: series('saves'), borderColor: colors.saves, backgroundColor: colors.saves + '22', tension: 0.3 }
  ];

  _chartInstances.main = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#cfcfcf', font: { family: 'Pretendard', size: 12 }, boxWidth: 14, padding: 14, usePointStyle: true }
        },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const v = ctx.parsed.y;
              if (v == null) return ctx.dataset.label + ': —';
              return ctx.dataset.label + ': ' + (mode === 'rate' ? (v >= 0 ? '+' : '') + v + '%' : v.toLocaleString());
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#aaa', font: { family: 'Bebas Neue', size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: {
          ticks: {
            color: '#aaa', font: { family: 'Bebas Neue', size: 11 },
            callback: (val) => mode === 'rate' ? (val + '%') : (val >= 1000 ? (val/1000).toFixed(1) + 'k' : val)
          },
          grid: { color: 'rgba(255,255,255,0.04)' },
          beginAtZero: mode === 'absolute'
        }
      }
    }
  });
}

function renderInsightSummaryCard(host, mission, prevMission) {
  const fi = mission.finalInsight || {};
  const pfi = prevMission && prevMission.finalInsight ? prevMission.finalInsight : null;

  const deltaPill = (cur, prev) => {
    if (prev == null || prev === 0) return '<span class="delta-pill flat">—</span>';
    const diff = cur - prev;
    const pct = Math.round((diff / prev) * 1000) / 10;
    const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
    const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '—';
    return `<span class="delta-pill ${cls}">${arrow} ${pct >= 0 ? '+' : ''}${pct}%</span>`;
  };

  const card = document.createElement('div');
  card.className = 'insight-summary-card';
  card.innerHTML = `
    <div class="isc-head">
      <div class="isc-title-block">
        <div class="isc-ttl">${escapeHtml(mission.title)}</div>
        <div class="isc-meta">${mission.type === 'reels' ? 'REELS' : 'FEED'} · WEEK ${mission.week} · 업로드 ${formatDate(mission.createdAt)}</div>
      </div>
      <a href="${ensureUrl(mission.url)}" target="_blank" rel="noopener" class="btn btn-ghost btn-xs">콘텐츠 보기 ↗</a>
    </div>
    <div class="isc-stats-grid">
      <div class="isc-stat">
        <div class="isc-lbl">조회수</div>
        <div class="isc-val">${(fi.views||0).toLocaleString()}</div>
        ${deltaPill(fi.views || 0, pfi ? pfi.views : null)}
      </div>
      <div class="isc-stat">
        <div class="isc-lbl">좋아요</div>
        <div class="isc-val">${(fi.likes||0).toLocaleString()}</div>
        ${deltaPill(fi.likes || 0, pfi ? pfi.likes : null)}
      </div>
      <div class="isc-stat">
        <div class="isc-lbl">댓글</div>
        <div class="isc-val">${(fi.comments||0).toLocaleString()}</div>
        ${deltaPill(fi.comments || 0, pfi ? pfi.comments : null)}
      </div>
      <div class="isc-stat">
        <div class="isc-lbl">공유</div>
        <div class="isc-val">${(fi.shares||0).toLocaleString()}</div>
        ${deltaPill(fi.shares || 0, pfi ? pfi.shares : null)}
      </div>
      <div class="isc-stat">
        <div class="isc-lbl">저장</div>
        <div class="isc-val">${(fi.saves||0).toLocaleString()}</div>
        ${deltaPill(fi.saves || 0, pfi ? pfi.saves : null)}
      </div>
    </div>
    <div class="isc-foot">
      ${fi.recordedAt ? `최근 갱신 ${formatTime(fi.recordedAt)}` : ''}
      ${prevMission ? ` · 이전 미션 「${escapeHtml(prevMission.title)}」 대비` : ''}
    </div>
  `;
  host.appendChild(card);
}

function renderFollowerBeforeAfter(participant) {
  const isAdmin = State.user.role === 'admin';
  const me = getCurrentParticipant();
  const isMine = me && me.id === participant.id;
  const canEdit = isAdmin || isMine;

  const before = participant.followerBefore || null;
  const after = participant.followerAfter || null;

  let growthHtml = '';
  if (before && after && before.count != null && after.count != null) {
    const diff = after.count - before.count;
    const pct = before.count > 0 ? Math.round((diff / before.count) * 1000) / 10 : null;
    const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
    const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '—';
    const sign = diff >= 0 ? '+' : '';
    growthHtml = `
      <div class="fb-growth ${cls}">
        <div class="fbg-arrow">${arrow}</div>
        <div class="fbg-body">
          <div class="fbg-lbl">팔로워 변화</div>
          <div class="fbg-num">${sign}${diff.toLocaleString()}명</div>
          ${pct != null ? `<div class="fbg-pct">${sign}${pct}%</div>` : ''}
        </div>
      </div>
    `;
  }

  const card = (kind, label, eyebrow, data, accentCls) => {
    const has = data && data.image;
    return `
      <div class="fb-card ${accentCls} ${has ? 'has-image' : 'empty'}">
        <div class="fb-eyebrow">${eyebrow}</div>
        <div class="fb-label">${label}</div>
        ${has ? `
          <div class="fb-shot" onclick="openImageLightbox('${data.image}')">
            <img src="${data.image}" alt="${label}">
          </div>
          <div class="fb-count">
            <span class="fbc-num">${(data.count || 0).toLocaleString()}</span>
            <span class="fbc-unit">팔로워</span>
          </div>
          <div class="fb-time">${data.recordedAt ? formatDate(data.recordedAt) + ' 기록' : ''}</div>
        ` : `
          <div class="fb-empty-shot">
            <div class="fbe-icon">📷</div>
            <div class="fbe-msg">아직 등록된 캡쳐가 없습니다</div>
          </div>
          <div class="fb-count empty"><span class="fbc-num">—</span><span class="fbc-unit">팔로워</span></div>
        `}
        ${canEdit ? `
          <div class="fb-actions">
            <button class="btn btn-ghost btn-sm" onclick="openFollowerEditor('${participant.id}', '${kind}')">${has ? '수정' : '등록'}</button>
            ${has ? `<button class="btn btn-danger btn-sm" onclick="clearFollowerData('${participant.id}', '${kind}')">삭제</button>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  };

  return `
    <div class="fb-section">
      <div class="fb-section-head">
        <div>
          <div class="section-eyebrow">BEFORE / AFTER</div>
          <h3 class="block-title" style="margin-bottom:4px;">팔로워 변화 인증샷</h3>
          <p style="font-size:12px; color:var(--ink-mute);">시즌 시작과 종료 시점의 인스타그램 프로필 캡쳐를 등록하면 성장이 한눈에 보입니다.</p>
        </div>
      </div>
      <div class="fb-grid">
        ${card('before', '시즌 시작', 'BEFORE · 시즌 출발선', before, 'before')}
        <div class="fb-arrow-cell">${growthHtml || '<div class="fb-arrow-empty">→</div>'}</div>
        ${card('after', '시즌 종료', 'AFTER · 시즌 결승선', after, 'after')}
      </div>
    </div>
  `;
}

function openFollowerEditor(participantId, kind) {
  const p = getParticipant(participantId);
  if (!p) return;
  const me = getCurrentParticipant();
  const isAdmin = State.user.role === 'admin';
  if (!isAdmin && (!me || me.id !== participantId)) {
    toast('본인 데이터만 수정할 수 있습니다.');
    return;
  }
  const existing = kind === 'before' ? p.followerBefore : p.followerAfter;
  const title = kind === 'before' ? '시즌 시작 팔로워 인증' : '시즌 종료 팔로워 인증';
  const tagLine = kind === 'before' ? '시즌 출발선의 인스타그램 프로필 캡쳐를 첨부해주세요.' : '시즌 결승선의 인스타그램 프로필 캡쳐를 첨부해주세요.';

  openModal({
    title,
    body: `
      <p style="font-size:12px; color:var(--ink-mute); margin-bottom:14px;">${tagLine}</p>
      <div class="field">
        <label>팔로워 수</label>
        <input type="number" min="0" id="fe-count" value="${existing && existing.count != null ? existing.count : ''}" placeholder="예: 1234">
      </div>
      <div class="field">
        <label>프로필 캡쳐 (PNG/JPG, 5MB 이하)</label>
        <input type="file" id="fe-file" accept="image/*">
        <div id="fe-preview" style="margin-top:10px;">
          ${existing && existing.image ? `<img src="${existing.image}" style="max-width:100%; max-height:280px; border:1px solid var(--line);">` : '<div style="color:var(--ink-mute); font-size:11px; font-family:var(--font-mono-display); letter-spacing:0.15em;">NO IMAGE YET</div>'}
        </div>
      </div>
    `,
    actions: [
      { label: '취소', class: 'btn-ghost', onclick: closeModal },
      { label: '저장', class: 'btn-primary', onclick: () => saveFollowerData(participantId, kind) }
    ]
  });

  setTimeout(() => {
    const fileInput = document.getElementById('fe-file');
    if (!fileInput) return;
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { toast('파일이 너무 큽니다 (5MB 초과).'); fileInput.value = ''; return; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const preview = document.getElementById('fe-preview');
        if (preview) preview.innerHTML = `<img src="${ev.target.result}" style="max-width:100%; max-height:280px; border:1px solid var(--line);">`;
        // store on input for retrieval
        fileInput.dataset.dataurl = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }, 50);
}

async function saveFollowerData(participantId, kind) {
  const p = getParticipant(participantId);
  if (!p) return;
  const countVal = parseInt(document.getElementById('fe-count').value, 10);
  const count = isNaN(countVal) ? null : Math.max(0, countVal);
  if (count == null) { toast('팔로워 수를 입력하세요.'); return; }

  const fileInput = document.getElementById('fe-file');
  const existing = kind === 'before' ? p.followerBefore : p.followerAfter;

  // Image: use new upload if present, otherwise keep existing image
  let image = existing && existing.image ? existing.image : null;
  if (fileInput && fileInput.dataset.dataurl) {
    image = fileInput.dataset.dataurl;
  }
  if (!image) {
    toast('프로필 캡쳐 이미지를 첨부해주세요.');
    return;
  }

  const data = { image, count, recordedAt: Date.now() };
  if (kind === 'before') p.followerBefore = data;
  else p.followerAfter = data;

  await Storage.set('participants', State.data.participants);
  closeModal();
  toast(`${kind === 'before' ? '시작' : '종료'} 시점 팔로워 등록됨`);
  // Re-render insights so new section reflects
  const host = document.getElementById('main-view');
  host.innerHTML = '';
  renderMyInsights(host);
}

async function clearFollowerData(participantId, kind) {
  const p = getParticipant(participantId);
  if (!p) return;
  const me = getCurrentParticipant();
  const isAdmin = State.user.role === 'admin';
  if (!isAdmin && (!me || me.id !== participantId)) return;
  if (!confirm(`${kind === 'before' ? '시작' : '종료'} 시점 데이터를 삭제할까요?`)) return;
  if (kind === 'before') delete p.followerBefore;
  else delete p.followerAfter;
  await Storage.set('participants', State.data.participants);
  toast('삭제됨');
  const host = document.getElementById('main-view');
  host.innerHTML = '';
  renderMyInsights(host);
}

window.openFollowerEditor = openFollowerEditor;
window.saveFollowerData = saveFollowerData;
window.clearFollowerData = clearFollowerData;

      ${subTabs.map(t => `<button class="metric-tab ${State.currentAdminTab === t.id ? 'active' : ''}" data-admin-tab="${t.id}" onclick="setAdminTab('${t.id}')">${t.label}</button>`).join('')}
    </div>
    <div id="admin-body"></div>
  `;
  renderAdminBody();
}

function setAdminTab(id) {
  State.currentAdminTab = id;
  document.querySelectorAll('#admin-subtabs .metric-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.adminTab === id);
  });
  renderAdminBody();
}

function renderAdminBody() {
  const wrap = document.getElementById('admin-body');
  if (!wrap) return;
  const tab = State.currentAdminTab;
  if (tab === 'participants') renderAdminParticipants(wrap);
  else if (tab === 'payments') renderAdminPayments(wrap);
  else if (tab === 'expenses') renderAdminExpenses(wrap);
  else if (tab === 'budget') renderAdminBudget(wrap);
  else if (tab === 'config') renderAdminConfig(wrap);
}

      <div class="field"><label>연락처</label><input id="pe-phone" value="${escapeHtml(p.phone)}"></div>

          <option value="현금영수증" ${p.paymentMethod === '현금영수증' ? 'selected' : ''}>현금영수증</option>

        <select id="pe-paymentStatus">
          <option value="paid" ${p.paymentStatus === 'paid' ? 'selected' : ''}>입금완료</option>

        </select>

      { label: isNew ? '추가' : '저장', class: 'btn-primary', onclick: () => saveParticipant(pid) }
    ]
  });
}

async function saveParticipant(pid) {
  const activity = document.getElementById('pe-activity').value.trim();
  const realName = document.getElementById('pe-realName').value.trim();
  if (!activity || !realName) { toast('활동명과 본명은 필수입니다.'); return; }
  const data = {
    activity, realName,
    phone: document.getElementById('pe-phone').value.trim(),
    email: document.getElementById('pe-email').value.trim(),
    category: document.getElementById('pe-category').value.trim(),
    insta: document.getElementById('pe-insta').value.trim(),
    groupId: document.getElementById('pe-groupId').value,
    paymentMethod: document.getElementById('pe-paymentMethod').value,
    paymentStatus: document.getElementById('pe-paymentStatus').value
  };
  if (pid) {
    const idx = State.data.participants.findIndex(x => x.id === pid);
    if (idx >= 0) State.data.participants[idx] = { ...State.data.participants[idx], ...data };
  } else {
    State.data.participants.push({ id: uid('p'), ...data });
  }
  await Storage.set('participants', State.data.participants);
  closeModal();
  toast(pid ? '참가자 수정됨' : '참가자 추가됨');
  renderAdminParticipants(document.getElementById('admin-body'));
}

async function deleteParticipant(pid) {
  if (!confirm('이 참가자를 삭제할까요? 관련 미션·댓글·인사이트도 함께 삭제됩니다.')) return;
  State.data.participants = State.data.participants.filter(x => x.id !== pid);
  const myMissionIds = State.data.missions.filter(m => m.participantId === pid).map(m => m.id);
  State.data.missions = State.data.missions.filter(m => m.participantId !== pid);
  State.data.comments = State.data.comments.filter(c => c.authorId !== pid && !myMissionIds.includes(c.missionId));
  State.data.insights = State.data.insights.filter(i => !myMissionIds.includes(i.missionId));
  await Storage.set('participants', State.data.participants);
  await Storage.set('missions', State.data.missions);
  await Storage.set('comments', State.data.comments);
  await Storage.set('insights', State.data.insights);
  toast('참가자 삭제됨');
  renderAdminParticipants(document.getElementById('admin-body'));
}

async function updatePaymentStatus(pid, v) {
  const p = State.data.participants.find(x => x.id === pid);

  renderAdminPayments(document.getElementById('admin-body'));
}

async function saveExpense(eid) {
  const category = document.getElementById('ex-category').value.trim();
  const amount = parseInt(document.getElementById('ex-amount').value) || 0;
  if (!category) { toast('카테고리를 입력하세요.'); return; }
  const note = document.getElementById('ex-note').value.trim();
  const date = new Date(document.getElementById('ex-date').value).getTime() || Date.now();
  if (eid) {
    const idx = State.data.expenses.findIndex(x => x.id === eid);
    if (idx >= 0) State.data.expenses[idx] = { ...State.data.expenses[idx], category, amount, note, date };
  } else {
    State.data.expenses.push({ id: uid('e'), category, amount, note, date });
  }
  await Storage.set('expenses', State.data.expenses);
  closeModal();
  toast(eid ? '지출 수정됨' : '지출 추가됨');
  renderAdminExpenses(document.getElementById('admin-body'));
}

async function deleteExpense(eid) {
  if (!confirm('이 지출 내역을 삭제할까요?')) return;
  State.data.expenses = State.data.expenses.filter(x => x.id !== eid);
  await Storage.set('expenses', State.data.expenses);
  toast('지출 삭제됨');
  renderAdminExpenses(document.getElementById('admin-body'));
}

/* ---------- 예산 현황 ---------- */
function renderAdminBudget(host) {
  const fee = State.data.defaultFee || 0;
  const collected = State.data.participants
    .filter(p => p.paymentStatus === 'paid')
    .reduce((s, p) => s + ((p.paymentAmount != null) ? p.paymentAmount : fee), 0);
  const expected = State.data.participants
    .filter(p => p.paymentStatus !== 'refund')
    .reduce((s, p) => s + ((p.paymentAmount != null) ? p.paymentAmount : fee), 0);
  const totalExp = State.data.expenses.reduce((s, x) => s + (x.amount || 0), 0);
  const balance = collected - totalExp;

  // Expense breakdown by category
  const byCat = {};
  State.data.expenses.forEach(x => {
    byCat[x.category] = (byCat[x.category] || 0) + (x.amount || 0);
  });
  const catRows = Object.entries(byCat)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, amt]) => `
      <tr>
        <td>${escapeHtml(cat)}</td>
        <td style="font-family:var(--font-display); font-weight:var(--font-display-weight); font-size:18px;">${formatMoney(amt)}</td>
        <td style="color:var(--ink-mute); font-family:var(--font-mono-display); font-size:11px;">${totalExp ? Math.round(amt/totalExp*100) : 0}%</td>
      </tr>
    `).join('');

  host.innerHTML = `
    <div class="budget-summary">
      <div class="stat-card"><div class="label">예상 입금 (환불 제외)</div><div class="value">${formatMoney(expected)}</div></div>
      <div class="stat-card"><div class="label">실제 입금 완료</div><div class="value good">${formatMoney(collected)}</div></div>
      <div class="stat-card"><div class="label">총 지출</div><div class="value bad">${formatMoney(totalExp)}</div></div>
      <div class="stat-card"><div class="label">잔액</div><div class="value ${balance >= 0 ? 'gold' : 'bad'}">${formatMoney(balance)}</div><div class="sub">${balance >= 0 ? '여유 자금' : '적자'}</div></div>
    </div>

    <h3 class="block-title">카테고리별 지출</h3>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>카테고리</th><th>금액</th><th>비중</th></tr></thead>
        <tbody>${catRows || '<tr><td colspan="3" class="empty-row">지출 내역이 없습니다.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

async function saveConfig() {

    totalWeeks: parseInt(document.getElementById('cfg-weeks').value, 10) || 6,

}

async function resetConfig() {
  if (!confirm('기본값으로 되돌릴까요?')) return;
  State.data.config = { ...DEFAULT_CONFIG };
  await Storage.set('config', State.data.config);
  toast('기본값 복원');
  renderAdminConfig(document.getElementById('admin-body'));
}

/* ========================================================

function openProfileEditor() {
  const me = getCurrentParticipant();
  if (!me) return;
  openModal({
    title: '내 프로필 수정',
    body: `
      <p style="font-size:12px; color:var(--ink-mute); margin-bottom:14px;">
        본명·연락처·이메일·소속조는 관리자만 변경할 수 있습니다.
      </p>
      <div class="field"><label>활동명</label><input id="prof-activity" class="input" value="${escapeHtml(me.activity)}"></div>
      <div class="field"><label>카테고리</label><input id="prof-category" class="input" value="${escapeHtml(me.category)}" placeholder="예: 패션/여행"></div>
      <div class="field"><label>인스타 URL</label><input id="prof-insta" class="input" value="${escapeHtml(me.insta)}" placeholder="https://www.instagram.com/..."></div>
    `,
    actions: [
      { label: '취소', class: 'btn-ghost', onclick: closeModal },
      { label: '저장', class: 'btn-primary', onclick: saveProfile }
    ]
  });
}

async function saveProfile() {
  const me = getCurrentParticipant();
  if (!me) return;
  const activity = document.getElementById('prof-activity').value.trim();
  if (!activity) { toast('활동명을 입력하세요.'); return; }
  me.activity = activity;
  me.category = document.getElementById('prof-category').value.trim();
  me.insta = document.getElementById('prof-insta').value.trim();
  await Storage.set('participants', State.data.participants);
  closeModal();
  toast('프로필이 업데이트되었습니다.');
  // Refresh header
  setupAppShell();
  switchTab(State.currentTab);
}

/* ========================================================
   SEASON REPORT (printable)
   ======================================================== */
function openSeasonReport(participantId) {
  const p = getParticipant(participantId);
  if (!p) return;
  const myMissions = State.data.missions.filter(m => m.participantId === p.id);
  const cfg = getConfig();
  const weeks = getSeasonWeeks();
  const target = cfg.weeklyTarget || 2;

  // Aggregate totals from finalInsight (6-day data entered by participant)
  let totalViews = 0, totalLikes = 0, totalComments = 0, totalSaves = 0, totalShares = 0;
  myMissions.forEach(m => {
    const li = m.finalInsight || {};
    totalViews += li.views || 0;
    totalLikes += li.likes || 0;
    totalComments += li.comments || 0;
    totalSaves += li.saves || 0;
    totalShares += li.shares || 0;
  });
  const grandTotal = totalViews + totalLikes + totalComments + totalSaves + totalShares;
  const reportedCount = myMissions.filter(m => m.finalInsight).length;

  // Weekly mission counts
  const weeklyCounts = weeks.map(w => myMissions.filter(m => m.week === w.weekNum).length);
  const achievedWeeks = weeklyCounts.filter(c => c >= target).length;

  // Top performing mission (by combined insights)
  const ranked = [...myMissions].map(m => ({ m, score: getMissionScore(m.id) })).sort((a,b) => b.score - a.score);
  const topMission = ranked[0];

  const reportHtml = `
    <div class="report-doc" id="report-doc">
      <div class="report-header">
        <div class="report-brand">
          <div class="report-brand-name">쌩존</div>
          <div class="report-brand-tag">FUCK IT, SHOOT IT! · 크리에이터 일지</div>
        </div>
        <div class="report-meta">
          <div class="report-meta-line">${escapeHtml(cfg.seasonName)}</div>
          <div class="report-meta-line">SEASON REPORT</div>
          <div class="report-meta-line">발급일 ${formatDate(Date.now())}</div>
        </div>
      </div>

      <div class="report-hero">
        <div class="report-hero-eyebrow">CREATOR</div>
        <div class="report-hero-name">${escapeHtml(p.activity)}</div>
        <div class="report-hero-sub">${escapeHtml(p.realName)} · ${escapeHtml(p.category)} · ${escapeHtml((getGroup(p.groupId) || {}).name || '-')}</div>
      </div>

      <div class="report-stats">
        <div class="report-stat"><div class="rs-num">${myMissions.length}</div><div class="rs-lbl">총 미션 인증</div></div>
        <div class="report-stat"><div class="rs-num">${reportedCount}</div><div class="rs-lbl">인사이트 보고</div></div>
        <div class="report-stat"><div class="rs-num">${achievedWeeks} / ${weeks.length}</div><div class="rs-lbl">목표 달성 주차</div></div>
        <div class="report-stat highlight"><div class="rs-num">${grandTotal.toLocaleString()}</div><div class="rs-lbl">총 인사이트</div></div>
        <div class="report-stat"><div class="rs-num">${totalViews.toLocaleString()}</div><div class="rs-lbl">누적 조회수</div></div>
        <div class="report-stat"><div class="rs-num">${totalLikes.toLocaleString()}</div><div class="rs-lbl">누적 좋아요</div></div>
        <div class="report-stat"><div class="rs-num">${totalComments.toLocaleString()}</div><div class="rs-lbl">누적 댓글</div></div>
        <div class="report-stat"><div class="rs-num">${totalShares.toLocaleString()}</div><div class="rs-lbl">누적 공유</div></div>
        <div class="report-stat"><div class="rs-num">${totalSaves.toLocaleString()}</div><div class="rs-lbl">누적 저장</div></div>
      </div>

      <div class="report-section">
        <h3 class="report-h3">주차별 업로드 추이</h3>
        <div class="weekly-bars">
          ${weeks.map((w, i) => {
            const c = weeklyCounts[i];
            const pct = Math.min(100, (c / Math.max(target, 1)) * 100);
            return `
              <div class="wbar">
                <div class="wbar-label">W${w.weekNum}</div>
                <div class="wbar-track"><div class="wbar-fill ${c >= target ? 'hit' : c > 0 ? 'partial' : 'miss'}" style="width:${pct}%"></div></div>
                <div class="wbar-val">${c} / ${target}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      ${topMission ? `
        <div class="report-section">
          <h3 class="report-h3">베스트 콘텐츠</h3>
          <div class="report-best">
            <div class="rb-title">${escapeHtml(topMission.m.title)}</div>
            <div class="rb-meta">${topMission.m.type === 'reels' ? 'REELS' : 'FEED'} · W${topMission.m.week} · ${formatDate(topMission.m.createdAt)}</div>
            <div class="rb-stats">총 인사이트 <strong>${topMission.score.toLocaleString()}</strong></div>
          </div>
        </div>
      ` : ''}

      <div class="report-section">
        <h3 class="report-h3">전체 콘텐츠 목록</h3>
        <table class="report-table">
          <thead><tr><th>주차</th><th>유형</th><th>제목</th><th>조회</th><th>좋아요</th><th>댓글</th><th>공유</th><th>저장</th></tr></thead>
          <tbody>
            ${[...myMissions].sort((a,b) => a.week - b.week || a.createdAt - b.createdAt).map(m => {
              const li = m.finalInsight || {};
              return `<tr>
                <td>W${m.week}</td>
                <td>${m.type === 'reels' ? 'REELS' : 'FEED'}</td>
                <td style="text-align:left;">${escapeHtml(m.title)}</td>
                <td>${(li.views || 0).toLocaleString()}</td>
                <td>${(li.likes || 0).toLocaleString()}</td>
                <td>${(li.comments || 0).toLocaleString()}</td>
                <td>${(li.shares || 0).toLocaleString()}</td>
                <td>${(li.saves || 0).toLocaleString()}</td>
              </tr>`;
            }).join('') || '<tr><td colspan="8" style="text-align:center; padding:20px; color:#999;">인증된 미션이 없습니다.</td></tr>'}
          </tbody>
        </table>
      </div>

      <div class="report-footer">
        <div>쌩존 · SSAENGJON · 6 WEEKS OF RAW EXISTENCE</div>
        <div style="opacity:0.6; font-size:11px; margin-top:4px;">이 리포트는 ${formatDate(Date.now())} 기준 데이터로 생성되었습니다.</div>
      </div>
    </div>
  `;

  openModal({
    title: `${p.activity} · 시즌 리포트`,
    wide: true,
    body: `
      <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" onclick="printReport()">🖨️ 인쇄 / PDF 저장</button>
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">닫기</button>
      </div>
      <div class="report-preview">${reportHtml}</div>
    `
  });
}

function openCertificate(participantId) {
  const p = getParticipant(participantId);

  const myMissions = State.data.missions.filter(m => m.participantId === p.id);
  const totalMissions = myMissions.length;
  const achievedWeeks = weeks.filter(w => myMissions.filter(m => m.week === w.weekNum).length >= target).length;
  const certNo = 'SSJ-' + (cfg.seasonName.match(/\d+/) || ['1'])[0].padStart(2, '0') + '-' + String(State.data.participants.findIndex(x => x.id === p.id) + 1).padStart(3, '0');

  const certHtml = `
    <div class="cert-doc" id="cert-doc">
      <div class="cert-border">
        <div class="cert-corner tl">▌</div>
        <div class="cert-corner tr">▐</div>

        <div class="cert-brand">쌩존</div>
        <div class="cert-tag">FUCK IT, SHOOT IT!</div>

        <div class="cert-title">수료증</div>
        <div class="cert-subtitle">CERTIFICATE OF COMPLETION</div>

        <div class="cert-body">
          <div class="cert-recip-line">아래의 크리에이터는</div>
          <div class="cert-name">${escapeHtml(p.activity)}</div>
          <div class="cert-realname">${escapeHtml(p.realName)}</div>
          <div class="cert-recip-line cert-statement">
            <strong>${escapeHtml(cfg.seasonName)}</strong>의 ${cfg.totalWeeks}주 크리에이터 일지에 참여하여<br>
            총 <strong>${totalMissions}개</strong>의 콘텐츠를 인증하고 <strong>${achievedWeeks}주차</strong>의 목표를 달성하였기에<br>
            이 수료증을 수여합니다.

        </div>

        <div class="cert-meta">
          <div class="cert-meta-left">
            <div class="cert-meta-row"><span class="lbl">발급일</span><span class="val">${formatDate(Date.now())}</span></div>
            <div class="cert-meta-row"><span class="lbl">증서번호</span><span class="val">${certNo}</span></div>
          </div>
          <div class="cert-meta-right">
            <div class="cert-seal">쌩존<br>구역장</div>

        </div>

    `
  });
}
